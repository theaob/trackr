name: Release & Publish to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release and image build even if version tag already exists'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Version & Tag
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version_check.outputs.should_release }}
      version: ${{ steps.version_check.outputs.version }}
      tag_name: ${{ steps.version_check.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect version and check tag existence
        id: version_check
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VERSION="${RAW_TAG#v}"
            TAG_NAME="v$VERSION"
            echo "Triggered by git tag: $TAG_NAME"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v$VERSION"
            echo "Current package.json version: $VERSION ($TAG_NAME)"

            git fetch --tags origin || true

            if git rev-parse "$TAG_NAME" >/dev/null 2>&1 && [[ "${{ github.event.inputs.force_release }}" != "true" ]]; then
              echo "Tag $TAG_NAME already exists in repository. Skipping release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "New version detected: $VERSION ($TAG_NAME)"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
            fi
          fi

  verify:
    name: Typecheck, Lint, Test & Build
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./ci-build.db
          GIT_COMMIT: ${{ github.sha }}

      - name: Install Chromium for the browser checks
        run: npx playwright install --with-deps chromium

      - name: Accessibility checks (axe on setup, sign-in and Projects)
        # Starts the production build on a fresh database; a serious or
        # critical axe finding fails the job.
        run: npm run test:e2e

  release-and-publish:
    name: Create Release & Push to Docker Hub
    # Nothing is published until the checks above pass.
    needs: [check-version, verify]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Docker Hub Secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Docker Hub credentials missing! Please add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to repository secrets (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Create Git Tag & GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.check-version.outputs.tag_name }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          echo "Processing release for $TAG_NAME..."
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub release $TAG_NAME already exists."
          else
            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              gh release create "$TAG_NAME" \
                --title "Release $TAG_NAME" \
                --generate-notes
            else
              gh release create "$TAG_NAME" \
                --target "${{ github.sha }}" \
                --title "Release $TAG_NAME" \
                --generate-notes
            fi
            echo "GitHub release $TAG_NAME created successfully."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_REPO || format('{0}/tamam', secrets.DOCKERHUB_USERNAME) }}
            ghcr.io/${{ github.repository_owner }}/tamam
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-version.outputs.version }}
            type=semver,pattern={{version}},value=${{ needs.check-version.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check-version.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.check-version.outputs.tag_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # amd64 only: building arm64 here means cross-compiling under QEMU
          # emulation on this x86 runner, which is 5-10x slower than a native
          # build and was the entire 13+ minutes this step used to take.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
