name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Check lockfile version
        # Releases are cut from package.json; a lockfile left behind drifts
        # until someone's next npm install drags it into an unrelated commit.
        run: |
          node -e '
            const pkg = require("./package.json").version;
            const lock = require("./package-lock.json");
            if (lock.version !== pkg || lock.packages[""].version !== pkg) {
              console.error(`package-lock.json is at ${lock.version}, package.json at ${pkg}. Bump with: npm version patch --no-git-tag-version`);
              process.exit(1);
            }'

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build needs a schema to talk to, not the production data.
          DATABASE_URL: file:./ci-build.db
          GIT_COMMIT: ${{ github.sha }}

      - name: Install Chromium for the browser checks
        run: npx playwright install --with-deps chromium

      - name: Accessibility checks (axe on setup, sign-in and Projects)
        # Starts the production build on a fresh database; a serious or
        # critical axe finding fails the job.
        run: npm run test:e2e
