services:
  tamam:
    build:
      context: .
      dockerfile: Dockerfile
    image: tamam:latest
    container_name: tamam-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/dev.db
      # Signs session cookies. Generate with: openssl rand -hex 32
      # Without it a secret is generated into the data volume on first start.
      - AUTH_SECRET=${AUTH_SECRET:-}
      # Set to 1 only if your webhook receivers live on a private network.
      - TAMAM_ALLOW_PRIVATE_WEBHOOKS=${TAMAM_ALLOW_PRIVATE_WEBHOOKS:-0}
      # Set to 1 to boot a fresh instance with seeded demo data instead of an
      # empty database + setup wizard. Ignored once a database already exists.
      - TAMAM_SEED_DEMO=${TAMAM_SEED_DEMO:-0}
      # Set to 1 only if a reverse proxy in front of this container terminates
      # HTTPS and forwards X-Forwarded-Proto: https. Leave at 0 for this
      # compose file's default of exposing port 3000 directly over HTTP --
      # enabling it without a proxy breaks sign-in (the session cookie would
      # be marked Secure and get dropped over plain HTTP).
      - TAMAM_TRUST_PROXY=${TAMAM_TRUST_PROXY:-0}
    volumes:
      - tamam_data:/app/data

volumes:
  tamam_data:
    driver: local
